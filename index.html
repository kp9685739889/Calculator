<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
:root{--bg1:#6a11cb;--bg2:#2575fc;--card:#ffffff;--text:#1a1a2e;--muted:#8a8fa3;--btn:#f1f2f6;--accent:#ff6b6b;--accent2:#ff9f43;--green:#1dd1a1;--blue:#54a0ff;--purple:#a55eea}
body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:16px;transition:.3s}
body.dark{--bg1:#0f0c29;--bg2:#302b63;--card:#1e1e2e;--text:#fff;--btn:#2d2d3d;--muted:#a0a0b5}
.wrap{width:100%;max-width:1020px}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.top h1{font-size:26px;font-weight:800;line-height:1}
.top h1 span{color:#ffeaa7}
.top p{font-size:13px;opacity:.9}
.theme-btn{background:#fff;border:0;padding:10px 16px;border-radius:50px;font-weight:600;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.2)}
body.dark .theme-btn{background:#2d2d3d;color:#fff}
.main{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:820px){.main{grid-template-columns:1fr}}
.calc{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);color:var(--text)}
.display{background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;border-radius:16px;padding:18px 18px 14px;text-align:right;position:relative;overflow:hidden}
.display::before{content:'';position:absolute;top:-20px;right:-20px;width:90px;height:90px;background:linear-gradient(135deg,#ff6b6b,#feca57);border-radius:50%;opacity:.25}
#historyMini{font-size:13px;color:#a0a0b5;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#result{font-size:42px;font-weight:800;line-height:1.1;word-break:break-all;min-height:52px}
#expression{font-size:15px;color:#dfe6e9;margin-top:4px;min-height:20px}
.display-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.display-actions button{border:0;background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;border-radius:20px;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;padding:10px;border:0;border-radius:12px;font-weight:700;cursor:pointer;background:var(--btn);color:var(--text)}
.tabs button.active{background:linear-gradient(90deg,#ff6b6b,#ff9f43);color:#fff}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:480px){.grid{grid-template-columns:repeat(4,1fr)} .sci-only{display:none} #result{font-size:34px}}
button.btn{border:0;padding:16px 5px;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;background:var(--btn);color:var(--text);transition:.15s;box-shadow:0 2px 0 rgba(0,0,0,.06)}
button.btn:hover{transform:translateY(-2px);filter:brightness(1.05)}
button.btn:active{transform:scale(.96)}
.btn.num{background:var(--btn)}
.btn.op{background:#fff3cd;color:#e17055}
body.dark .btn.op{background:#3a2e1a}
.btn.sci{background:#e8f8f5;color:#00b894}
body.dark .btn.sci{background:#1e3a34}
.btn.eq{background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff;font-size:22px;grid-column:span 2}
.btn.clear{background:#ff6b6b;color:#fff}
.btn.del{background:#fdcb6e;color:#2d3436}
.btn.zero{grid-column:span 2}
.features{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.features span{background:#eef2ff;color:#6c5ce7;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
body.dark .features span{background:#2a2a4a}
.side{background:var(--card);border-radius:24px;padding:18px;color:var(--text);box-shadow:0 20px 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.side h3{font-size:16px;display:flex;justify-content:space-between;align-items:center}
.side h3 button{border:0;background:#ff6b6b;color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
#historyList{margin-top:12px;flex:1;overflow:auto;max-height:380px}
.hist-item{background:var(--btn);padding:10px 12px;border-radius:12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.hist-item small{color:var(--muted);display:block;font-size:12px}
.hist-item b{font-size:15px}
.converter{margin-top:16px;background:linear-gradient(135deg,#a55eea,#54a0ff);color:#fff;padding:14px;border-radius:14px}
.converter h4{font-size:14px;margin-bottom:8px}
.converter input,.converter select{width:100%;padding:10px;border:0;border-radius:10px;margin-bottom:8px;font-size:14px}
.converter p{font-weight:700}
.footer{text-align:center;color:#fff;font-size:12px;margin-top:14px;opacity:.9}
.footer a{color:#ffeaa7;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div></div>
<button class="theme-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i> Dark / Light</button>
</div>
<div class="main">
<div class="calc">
<div class="display">
<div id="historyMini"></div>
<div id="result">0</div>
<div id="expression"></div>
<div class="display-actions">
<button onclick="copyResult()"><i class="fa-regular fa-copy"></i> Copy</button>
<button onclick="toggleSign()">+/-</button>
<button onclick="useAns()">ANS</button>
</div>
</div>
<div class="tabs">
<button id="tabStd" class="active" onclick="setMode('std')">Standard</button>
<button id="tabSci" onclick="setMode('sci')">Scientific</button>
<button onclick="clearAll()">Clear All</button>
</div>
<div class="grid" id="btnGrid">
<button class="btn clear" onclick="clearAll()">C</button>
<button class="btn del" onclick="backspace()"><i class="fa-solid fa-delete-left"></i></button>
<button class="btn op" onclick="append('%')">%</button>
<button class="btn op" onclick="append('/')">÷</button>
<button class="btn sci sci-only" onclick="append('Math.sqrt(')">√</button>
<button class="btn num" onclick="append('7')">7</button>
<button class="btn num" onclick="append('8')">8</button>
<button class="btn num" onclick="append('9')">9</button>
<button class="btn op" onclick="append('*')">×</button>
<button class="btn sci sci-only" onclick="append('**')">x²</button>
<button class="btn num" onclick="append('4')">4</button>
<button class="btn num" onclick="append('5')">5</button>
<button class="btn num" onclick="append('6')">6</button>
<button class="btn op" onclick="append('-')">−</button>
<button class="btn sci sci-only" onclick="append('Math.sin(')">sin</button>
<button class="btn num" onclick="append('1')">1</button>
<button class="btn num" onclick="append('2')">2</button>
<button class="btn num" onclick="append('3')">3</button>
<button class="btn op" onclick="append('+')">+</button>
<button class="btn sci sci-only" onclick="append('Math.cos(')">cos</button>
<button class="btn num zero" onclick="append('0')">0</button>
<button class="btn num" onclick="append('.')">.</button>
<button class="btn sci sci-only" onclick="append('Math.PI')">π</button>
<button class="btn sci sci-only" onclick="append('Math.log10(')">log</button>
<button class="btn sci sci-only" onclick="append('Math.tan(')">tan</button>
<button class="btn sci sci-only" onclick="append('(')">(</button>
<button class="btn sci sci-only" onclick="append(')')">)</button>
<button class="btn sci sci-only" onclick="append('Math.E')">e</button>
<button class="btn eq" onclick="calculate()">=</button>
</div>
<div class="features">
<span>Keyboard Support</span><span>History Save</span><span>Scientific Mode</span><span>Mobile Friendly</span><span>Copy Result</span><span>Unit Converter</span>
</div>
</div>
<div class="side">
<h3>Calculation History <button onclick="clearHistory()">Clear</button></h3>
<div id="historyList"><p style="color:var(--muted);font-size:13px;margin-top:10px">No history yet. Do a calculation.</p></div>
<div class="converter">
<h4>Quick Unit Converter</h4>
<input type="number" id="convInput" placeholder="Enter value" oninput="convertUnit()" value="100">
<select id="convType" onchange="convertUnit()">
<option value="cm-inch">CM → Inch</option>
<option value="inch-cm">Inch → CM</option>
<option value="kg-lb">KG → LB</option>
<option value="c-f">Celsius → Fahrenheit</option>
<option value="km-mile">KM → Mile</option>
</select>
<p id="convResult">Result: -</p>
</div>
<p style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center">Tip: Press Enter to calculate • Backspace to delete</p>
</div>
</div>
<div class="footer"> <a href="#"> </a></div>
</div>
<script>
let expr = "", ans = 0, history = JSON.parse(localStorage.getItem('calcHist')||'[]');
let mode = 'std';

// Safe Math Parser (Degrees mode + Auto-close parentheses + No eval)
function safeEvaluate(input) {
  let clean = input.replace(/÷/g, '/').replace(/×/g, '*').replace(/\s+/g, '');
  const openCount = (clean.match(/\(/g) || []).length;
  const closeCount = (clean.match(/\)/g) || []).length;
  if (openCount > closeCount) clean += ')'.repeat(openCount - closeCount);

  const tokens = clean.match(/(?:Math\.(?:sqrt|sin|cos|tan|log10|PI|E)|\*\*|\d*\.?\d+|[+\-*/%()])/g);
  if (!tokens || tokens.join('') !== clean) throw new Error('Invalid expression');

  let pos = 0;
  const peek = () => tokens[pos];
  const consume = () => tokens[pos++];

  function parseExpression() {
    let left = parseTerm();
    while (peek() === '+' || peek() === '-') {
      const op = consume();
      const right = parseTerm();
      left = op === '+' ? left + right : left - right;
    }
    return left;
  }

  function parseTerm() {
    let left = parsePower();
    while (peek() === '*' || peek() === '/' || peek() === '%') {
      const op = consume();
      const right = parsePower();
      if (op === '*') left *= right;
      else if (op === '/') {
        if (right === 0) throw new Error('Division by zero');
        left /= right;
      } else left %= right;
    }
    return left;
  }

  function parsePower() {
    let base = parseUnary();
    if (peek() === '**') {
      consume();
      base = Math.pow(base, parsePower());
    }
    return base;
  }

  function parseUnary() {
    if (peek() === '+') { consume(); return parseUnary(); }
    if (peek() === '-') { consume(); return -parseUnary(); }
    return parsePrimary();
  }

  function parsePrimary() {
    const tok = peek();
    if (!tok) throw new Error('Unexpected end');
    if (tok === '(') {
      consume();
      const val = parseExpression();
      if (consume() !== ')') throw new Error('Missing parenthesis');
      return val;
    }
    if (tok === 'Math.PI') { consume(); return Math.PI; }
    if (tok === 'Math.E') { consume(); return Math.E; }
    if (['Math.sqrt', 'Math.sin', 'Math.cos', 'Math.tan', 'Math.log10'].includes(tok)) {
      consume();
      if (consume() !== '(') throw new Error('Expected (');
      const arg = parseExpression();
      if (consume() !== ')') throw new Error('Expected )');
      const rad = arg * (Math.PI / 180);
      if (tok === 'Math.sqrt') return Math.sqrt(arg);
      if (tok === 'Math.sin') return Math.sin(rad);
      if (tok === 'Math.cos') return Math.cos(rad);
      if (tok === 'Math.tan') return Math.tan(rad);
      if (tok === 'Math.log10') return Math.log10(arg);
    }
    if (/^\d*\.?\d+$/.test(tok)) {
      consume();
      return parseFloat(tok);
    }
    throw new Error('Unexpected token');
  }

  const result = parseExpression();
  if (pos !== tokens.length || !isFinite(result) || isNaN(result)) throw new Error('Invalid');
  return result;
}

function updateDisplay(){ document.getElementById('result').innerText = expr || '0'; document.getElementById('expression').innerText = expr ? 'Tap = to calculate' : ''; }
function append(v){ if(expr==='0' && !isNaN(v)) expr=''; expr += v; updateDisplay(); }
function clearAll(){ expr=''; updateDisplay(); document.getElementById('historyMini').innerText=''; }
function backspace(){ expr = expr.slice(0,-1); updateDisplay(); }
function toggleSign(){ try{ let val = safeEvaluate(expr||'0'); expr = String(-val); updateDisplay(); }catch(e){} }
function useAns(){ expr += ans; updateDisplay(); }
function copyResult(){ navigator.clipboard.writeText(document.getElementById('result').innerText); alert('Result Copied!'); }
function setMode(m){ mode=m; document.getElementById('tabStd').classList.toggle('active', m==='std'); document.getElementById('tabSci').classList.toggle('active', m==='sci'); document.querySelectorAll('.sci-only').forEach(el=> el.style.display = m==='sci' ? 'block' : 'none'); }
function calculate(){
  if(!expr) return;
  try{
    let res = safeEvaluate(expr);
    res = Math.round(res*100000000)/100000000;
    document.getElementById('historyMini').innerText = expr + ' =';
    document.getElementById('result').innerText = res;
    document.getElementById('expression').innerText = 'Answer: ' + res;
    ans = res;
    history.unshift({exp: expr, res: res});
    history = history.slice(0,20);
    localStorage.setItem('calcHist', JSON.stringify(history));
    renderHistory();
    expr = String(res);
  }catch(e){
    document.getElementById('result').innerText='Error';
    expr='';
  }
}
function renderHistory(){ let box = document.getElementById('historyList'); if(!history.length){ box.innerHTML='<p style="color:var(--muted);font-size:13px">No history yet.</p>'; return; } box.innerHTML = history.map((h,i)=>`<div class="hist-item" onclick="loadHist(${i})"><div><small>${h.exp}</small><b>= ${h.res}</b></div><span>↩</span></div>`).join(''); }
function loadHist(i){ expr = String(history[i].res); updateDisplay(); }
function clearHistory(){ history=[]; localStorage.removeItem('calcHist'); renderHistory(); }
function toggleTheme(){ document.body.classList.toggle('dark'); }
function convertUnit(){ let v = parseFloat(document.getElementById('convInput').value)||0; let t = document.getElementById('convType').value, r=0; if(t==='cm-inch') r=v/2.54; if(t==='inch-cm') r=v*2.54; if(t==='kg-lb') r=v*2.20462; if(t==='c-f') r=(v*9/5)+32; if(t==='km-mile') r=v*0.621371; document.getElementById('convResult').innerText='Result: '+r.toFixed(2); }
document.addEventListener('keydown', e=>{ if(/^[0-9+\-*/.%()]$/.test(e.key)) append(e.key); else if(e.key==='Enter'){ e.preventDefault(); calculate(); } else if(e.key==='Backspace') backspace(); else if(e.key==='Escape') clearAll(); });
setMode('std'); renderHistory(); convertUnit(); updateDisplay();
</script>
</body>
</html>
